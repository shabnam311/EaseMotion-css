<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Wave Button - EaseMotion</title>
    <!-- Include EaseMotion CSS -->
    <link rel="stylesheet" href="../../../easemotion.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout-container">
        <header class="header">
            <h1 class="title">Liquid Wave Button</h1>
            <p class="subtitle">A pure CSS interactive button that simulates a liquid wave filling effect on hover.</p>
        </header>

        <main class="showcase">
            <div class="button-wrapper">
                <a href="#" class="btn-liquid">
                    <span>Discover More</span>
                    <div class="liquid"></div>
                </a>
            </div>
            
            <div class="button-wrapper button-wrapper-dark">
                <a href="#" class="btn-liquid btn-liquid-alt">
                    <span>Launch App</span>
                    <div class="liquid"></div>
                </a>
            </div>
        </main>
    </div>
</body>
</html>
